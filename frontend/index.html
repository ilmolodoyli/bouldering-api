<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Турнир | Судья</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b0c0d;color:#f8f8fa;font:15px system-ui,sans-serif}button,input{font:inherit}button{cursor:pointer;color:inherit;border:1px solid #ffffff20;background:#ffffff0c;border-radius:16px;min-height:46px;padding:12px}button:disabled{opacity:.4;cursor:not-allowed}button:focus-visible,input:focus-visible{outline:2px solid #ff8417;outline-offset:3px}#app{max-width:450px;margin:auto;height:100dvh;display:flex;flex-direction:column;background:radial-gradient(ellipse at 110% 0,#64432355,transparent 40%)}header{padding:24px 20px 10px}h1{font-size:30px;margin:0}h2{font-size:21px;margin:0 0 14px}p{line-height:1.5}.sub{font-size:12px;color:#aaa;line-height:1.5;margin:4px 0}.notice{padding:10px 12px;border:1px solid #ff861d45;border-radius:12px;font-size:12px;background:#ff861d0b;margin:10px 0}.routebar,nav{display:flex;gap:5px;border:1px solid #ffffff40;background:linear-gradient(#ffffff25,#ffffff05);border-radius:28px;padding:4px;backdrop-filter:blur(20px)}.routebar button{flex:1;padding:8px 5px;border:0;border-radius:24px;min-height:42px;font-size:13px}.on{background:#ffffff30!important;box-shadow:inset 0 1px #ffffff60}.routebar{margin-top:12px}main{flex:1;overflow:auto;padding:0 16px 16px}input{width:100%;background:#ffffff0c;border:1px solid #ffffff25;color:white;border-radius:14px;min-height:48px;padding:12px;margin:10px 0}.athlete{width:100%;display:grid;grid-template-columns:30px 1fr;text-align:left;gap:8px;background:none;border:0;border-bottom:1px solid #ffffff0a;border-radius:0;padding:16px 8px;min-height:74px}.athlete .no{color:#999;grid-row:span 2}.athlete strong{font-size:14px}.athlete small{grid-column:2;color:#999;font-size:11px}.athlete.done{opacity:.55}.status{color:#ff981c;font-size:11px}.good{color:#9dcda4}nav{margin:8px 16px 14px}nav button{border:0;background:none;flex:1;font-size:10px;border-radius:24px;padding:8px 2px;min-height:48px}nav span{display:block;font-size:18px;margin-bottom:3px}.overlay{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;justify-content:center;padding:12px 12px 84px}.sheet{width:min(100%,426px);max-height:calc(100dvh - 110px);overflow:auto;border:1px solid #ffffff55;border-radius:26px;background:linear-gradient(#ffffff13,transparent),#25262aeb;backdrop-filter:blur(24px);padding:20px 12px 12px;box-shadow:0 20px 60px #0008}.sheet .action{width:100%;margin:7px 0;font-weight:700;min-height:57px}.primary{background:#ff8313;color:#111;border:0;font-weight:750}.text{background:none;border:0;color:#ff981c;width:100%;font-weight:650}.stats{display:flex;gap:8px;margin:20px 0}.stats>div{flex:1;text-align:center;min-width:0}.stats b{display:block;font-size:35px}.stats small{display:block;font-size:10px;color:#aaa;margin:3px 0 10px}.stats button{padding:0;border-radius:50%;width:34px;min-height:34px;font-size:20px;margin:0 2px}.error{color:#ffb0a9;white-space:pre-wrap}.pick{display:flex;align-items:center;gap:12px;margin:8px 0;padding:10px;background:#ffffff08;border-radius:14px}.pick input{width:22px;min-height:22px;margin:0;accent-color:#ff8313}.card{padding:16px;border:1px solid #ffffff20;border-radius:18px;margin:12px 0}.full{width:100%}a{color:#ffab54} .empty{color:#bbb;padding:20px 6px} @media(max-width:340px){header{padding:20px 14px 10px}.stats{gap:0}.sheet{padding:16px 8px}.stats button{width:30px}nav{margin-left:10px;margin-right:10px}}
</style></head><body><div id="app"></div><script type="module" src="./ui.mjs"></script></body></html>
